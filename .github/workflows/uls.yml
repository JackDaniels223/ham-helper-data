# Builds the Ham Helper callsign data from FCC ULS public files and publishes it to the rolling release "current".
# Schedule: daily delta from l_am_<day>.zip; Sundays a full rebuild from the weekly l_amat.zip + a reconcile delta.
# Safety (QA N-H1): every source file's HTTP Last-Modified must be newer than the last one processed (sources.json),
# otherwise the build exits 75 and nothing is published; the daily merge never applies an older license over a newer one;
# a full build whose active count moves > 2% is refused. The manifest is Ed25519-signed (secret MANIFEST_SIGNING_KEY,
# used only in the signing step). Removal requests: secret SUPPRESS_LIST (newline-separated callsigns, build step only; never
# committed or published). Version stamps = the FCC file's Last-Modified (UTC YYYYMMDDHHMM). A privacy guard fails the
# build if any address-like value survives city sanitising. Actions are pinned by commit SHA. Other auth: GITHUB_TOKEN only.
# PRIVATE state (QA b4cbdf1 M3): out/private/{state.hhc.gz,purge.json} is NEVER published. Between runs it lives only in the
# Actions cache, AES-256-GCM sealed (data/pipeline/private-box.mjs, key derived from MANIFEST_SIGNING_KEY) because fork-PR
# workflows can restore a public repo's caches but never get secrets. Cache miss → a full build (the delta chain resets).
# The public sources.json holds only source Last-Modified stamps; purge state is never logged.
name: uls-data
on:
  schedule:
    - cron: '30 15 * * *'   # daily 15:30 UTC (FCC posts dailies ~08:00 UTC; the weekly l_amat.zip ~13:20 UTC Sunday)
  workflow_dispatch:
    inputs:
      mode: { description: 'auto | full | daily', default: 'auto', type: choice, options: [auto, full, daily] }
      force: { description: 'Re-process a source file with the SAME Last-Modified (never an older one)', default: false, type: boolean }
permissions:
  contents: write
concurrency: { group: uls-data, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04    # pinned (ubuntu-latest moves to 26.04 from 2026-10-19)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { path: data }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: Restore sealed private state from the Actions cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: box, key: 'uls-private-${{ github.run_id }}-${{ github.run_attempt }}', restore-keys: 'uls-private-' }
      - name: Open private state; restore public files from the rolling release
        env: { GH_TOKEN: '${{ github.token }}', PRIVATE_BOX_SECRET: '${{ secrets.MANIFEST_SIGNING_KEY }}' }
        run: |
          set -euo pipefail
          mkdir -p out/private && node data/pipeline/private-box.mjs open box out/private
          cd out
          gh release download current --repo "$GITHUB_REPOSITORY" --pattern 'chain.json' --pattern 'sources.json' --pattern 'full-*.hhc.gz' --pattern 'delta-*.hhc.gz' || echo "first run"
          # one-time migration from the old layout: the public state file seeds the private state, then is deleted below
          if [ ! -f private/state.hhc.gz ] && gh release download current --repo "$GITHUB_REPOSITORY" --pattern 'state.hhc.gz' -D legacy 2>/dev/null; then mv legacy/state.hhc.gz private/state.hhc.gz; echo "migrated legacy state"; fi
          rm -rf legacy
          # the public sources.json never carries purge state (older builds wrote purgePending)
          [ -f sources.json ] && node -e "const f='sources.json',j=require('./'+f);delete j.purgePending;require('fs').writeFileSync(f,JSON.stringify(j,null,1))" || true
      - name: Build (fails closed on stale sources)
        env: { MODE: '${{ inputs.mode }}', FORCE: '${{ inputs.force }}', SUPPRESS_LIST: '${{ secrets.SUPPRESS_LIST }}' }
        run: |
          set -uo pipefail
          DOW=$(date -u -d yesterday +%a | tr A-Z a-z)  # l_am_<day> holds <day>'s transactions and is posted the next morning (~08:00 UTC)
          P="node --no-warnings --experimental-transform-types --import ./data/pipeline/ts-resolve.mjs data/pipeline/build.mts"
          F=""; [ "${FORCE:-false}" = "true" ] && F="--force"
          lm() { curl -fsSIL --retry 3 "$1" | tr -d '\r' | awk 'tolower($1)=="last-modified:"{sub(/^[^:]*: */,""); v=$0} END{print v}'; }
          M="${MODE:-auto}"; if [ "$M" = "auto" ]; then if [ "$(date -u +%u)" = "7" ] || [ ! -f out/private/state.hhc.gz ]; then M=full; else M=daily; fi; fi
          if [ "$M" = "full" ]; then
            U=https://data.fcc.gov/download/pub/uls/complete/l_amat.zip; LM=$(lm $U); echo "source $U Last-Modified: $LM"
            curl -fsSL --retry 3 -o src.zip $U && unzip -q -o src.zip -d uls || exit 1
            $P full uls out --last-modified "$LM" $F && rc=0 || rc=$?
          else
            U=https://data.fcc.gov/download/pub/uls/daily/l_am_${DOW}.zip; LM=$(lm $U); echo "source $U Last-Modified: $LM"
            curl -fsSL --retry 3 -o src.zip $U && unzip -q -o src.zip -d daily || exit 1
            $P daily out/private/state.hhc.gz daily out --last-modified "$LM" $F && rc=0 || rc=$?
          fi
          if [ $rc -eq 75 ]; then echo "::notice::stale source, nothing published"; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          exit $rc
      - name: Seal private state
        if: hashFiles('out/private/state.hhc.gz') != ''
        env: { PRIVATE_BOX_SECRET: '${{ secrets.MANIFEST_SIGNING_KEY }}' }
        run: rm -rf box && node data/pipeline/private-box.mjs seal out/private box
      - name: Save sealed private state to the Actions cache
        if: hashFiles('box/state.hhc.gz.box') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with: { path: box, key: 'uls-private-${{ github.run_id }}-${{ github.run_attempt }}' }
      - name: Remove any public copy of the state file (legacy layout)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if gh release view current --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx 'state.hhc.gz'; then gh release delete-asset current state.hhc.gz -y --repo "$GITHUB_REPOSITORY"; echo "deleted public state.hhc.gz"; fi
      - name: Sign manifest
        if: env.SKIP != '1'
        env: { MANIFEST_SIGNING_KEY: '${{ secrets.MANIFEST_SIGNING_KEY }}' }
        run: node --no-warnings --experimental-transform-types --import ./data/pipeline/ts-resolve.mjs data/pipeline/build.mts manifest out
      - name: Publish to the rolling release "current" (dated files first, manifest last)
        if: env.SKIP != '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          [ -f out/chain.json ] || echo "[]" > out/chain.json
          gh release view current --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create current --repo "$GITHUB_REPOSITORY" --title "Callsign data (rolling)" --notes "FCC ULS public amateur data, active licenses only. See README."
          gh release upload current out/*.hhc.gz out/chain.json out/sources.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload current out/manifest.json --clobber --repo "$GITHUB_REPOSITORY"
          node -e "const e=require('./out/manifest.json');const m=JSON.parse(e.payload);console.log(['manifest.json','chain.json','sources.json',m.full.url,...m.deltas.map(d=>d.url)].join('\n'))" > keep.txt
          gh release view current --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | { grep -vxFf keep.txt || true; } | xargs -r -I{} gh release delete-asset current {} -y --repo "$GITHUB_REPOSITORY"
      - name: Keep-alive commit (scheduled workflows auto-disable after 60 days without repo activity)
        if: env.SKIP != '1'
        run: |
          cd data && cp ../out/manifest.json last-manifest.json && cp ../out/sources.json last-sources.json
          git config user.name "uls-bot"; git config user.email "uls-bot@users.noreply.github.com"
          git add last-manifest.json last-sources.json && git commit -m "data $(date -u +%F)" && git push || echo "no change"
